            margin-bottom: 20px;

            width: 100%;
        }

            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;

            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

            background: #e2e8f0;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-filter:hover, .btn-filter.active {
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .badge-group {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;
            font-size: 12px;
        }

        .badge-type-hq {
            color: #059669;
            background-color: #ecfdf5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

            color: #d97706;
            background-color: #fffbeb;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;

    { group: "롯데", type: "본사", name: "-", position: "본사", address: "서울특별시 송파구 올림픽로 300(신천동 29) 롯데월드타워" },
    { group: "롯데", type: "임원", name: "신동빈", position: "그룹 회장", address: "송파구 올림픽로 300, 7001호(롯데월드타워동)" },
    { group: "롯데", type: "임원", name: "오일근", position: "롯데건설 대표", address: "서초구 신반포로 251, 114동 401호(메이플자이1단지)" }
];

let selectedGroup = "전체";

// 초기화
function init() {
    renderFilterButtons();
    renderTable(rawData);
}

// 필터 버튼 생성
function renderFilterButtons() {
    const groups = ["전체", ...new Set(rawData.map(item => item.group))];
    const container = document.getElementById("filterButtons");
    
    container.innerHTML = groups.map(g => 
        `<button class="btn-filter ${g === '전체' ? 'active' : ''}" onclick="selectFilter('${g}', this)">${g}</button>`
    ).join('');
}

// 필터 버튼 클릭 시
function selectFilter(group, btn) {
    selectedGroup = group;
    
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    filterData();
}

// 검색 및 필터링 적용 함수
function filterData() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    
    const filtered = rawData.filter(item => {
        // 그룹 필터 체크
        const matchGroup = (selectedGroup === "전체") || (item.group === selectedGroup);
        
        // 검색어 필터 체크
        const matchQuery = 
            item.group.toLowerCase().includes(query) ||
            item.type.toLowerCase().includes(query) ||
            item.name.toLowerCase().includes(query) ||
            item.position.toLowerCase().includes(query) ||
            item.address.toLowerCase().includes(query);
            
        return matchGroup && matchQuery;
    });

    renderTable(filtered);
}

// 테이블 출력 함수
function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    const stats = document.getElementById("statsCount");

    stats.innerText = `총 ${data.length}개의 항목이 검색되었습니다.`;

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="no-result">검색 조건에 해당되는 정보가 없습니다.</td></tr>`;
        return;
    }

    tbody.innerHTML = data.map((item, index) => {
        const typeBadge = item.type === "임원" 
            ? `<span class="badge-type-person">임원</span>`
            : `<span class="badge-type-hq">${item.type}</span>`;

        return `
            <tr>
                <td style="text-align: center; color: #64748b;">${index + 1}</td>
                <td><span class="badge-group">${item.group}</span></td>
                <td>${typeBadge}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.position}</td>
                <td>${item.address}</td>
            </tr>
        `;
    }).join('');
}

// 페이지 로드 시 시작
window.onload = init;
</script>
